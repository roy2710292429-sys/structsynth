name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest -q

  hyperframes:
    name: Promo project lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promo-structsynth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: promo-structsynth/package-lock.json
      - run: npm ci
      - run: npx --yes hyperframes@0.8.210 lint
